version: '3.8'

networks:
  korp_network:
    driver: bridge

services:
  http-server-projeto-korp:
    build: .
    image: http-server-projeto-korp
    networks:
      - korp_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf
    networks:
      - korp_network
    depends_on:
      - http-server-projeto-korp


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - korp_network
    depends_on:
      - http-server-projeto-korp


  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000" 
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - korp_network
    depends_on:
      - prometheus